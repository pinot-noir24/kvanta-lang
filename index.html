<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kvanta – IDE</title>
</head>
<body>
  <div class="app">
    <!-- Toolbar -->
    <div class="toolbar">
      <div class="toolbar__brand">
        <svg class="toolbar__icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M12 2L2 12l10 10 10-10L12 2z" fill="var(--accent)" opacity="0.15" stroke="var(--accent)"/>
          <circle cx="12" cy="12" r="3" fill="var(--accent)" stroke="none"/>
        </svg>
        <span class="toolbar__title">Kvanta</span>
      </div>
      <div class="spacer"></div>
      <div class="toolbar__actions">
        <input type="file" id="fileInput" accept=".quanta,.txt">
        <button id="downloadBtn" class="btn btn--ghost" title="Download source">Download</button>
        <button id="loadBtn" class="btn btn--ghost" title="Upload from file">Upload</button>
        <button id="saveBtn" class="btn btn--ghost" title="Save canvas as image">Save Image</button>
        <button id="themeToggle" class="btn btn--icon" title="Toggle theme" aria-label="Toggle theme"></button>
        <button id="runBtn" class="btn btn--primary" data-state="run" title="Run your program">Run</button>
      </div>
    </div>

    <!-- Main panes -->
    <div class="panes" id="panes">
      <!-- Left: Editor + Console -->
      <div class="pane">
        <div class="pane__header">Source</div>
        <div class="editor-pane">
          <div id="editor"></div>
          <div class="resizer resizer--vertical" id="vResizer" aria-hidden="true"></div>
          <div class="console-panel" id="consolePanel">
            <div class="console-panel__header">
              <span>Console</span>
              <button class="btn btn--tiny" id="consoleClearBtn" title="Clear console">Clear</button>
            </div>
            <div class="console-panel__body" id="consoleOutput"></div>
            <div class="console-panel__input-wrap">
              <input type="text" id="consoleInput" class="console-panel__input"
                     placeholder="Input (not connected)" disabled />
            </div>
          </div>
        </div>
      </div>

      <!-- Horizontal resizer -->
      <div class="resizer resizer--horizontal" id="resizer" aria-hidden="true"></div>

      <!-- Right: Canvas -->
      <div class="pane">
        <div class="pane__header">Result</div>
        <div class="resultWrap">
          <div class="canvasContainer">
            <canvas id="canvas" class="canvas" width="1000" height="1000" tabindex="0"></canvas>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="./web/main.js"></script>
</body>
</html>
